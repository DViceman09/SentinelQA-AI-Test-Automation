spring.application.name=shoplite

# Local defaults; docker compose overrides them with SPRING_DATASOURCE_* env vars.
spring.datasource.url=jdbc:postgresql://localhost:5432/shoplite
spring.datasource.username=shoplite
spring.datasource.password=shoplite

# Demo toggles (env: SHOPLITE_DEFECTS / SHOPLITE_REDESIGN). See README "Planted defects".
shoplite.defects=false
shoplite.redesign=false

spring.web.error.include-message=always
server.servlet.session.cookie.same-site=lax
# Never put the session id in URLs (;jsessionid=...): it leaks via history, logs and Referer. Found by SecurityRegressionTest.
server.servlet.session.tracking-modes=cookie
springdoc.swagger-ui.path=/swagger-ui.html
